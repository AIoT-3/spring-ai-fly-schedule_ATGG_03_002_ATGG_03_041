spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spring-ai-fly-schedule-002-041

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:1.5b
      embedding:
        options:
          model: bge-m3
    google:
      genai:
        api-key: ${GEMINI_API_KEY}        # 환경 변수
        chat:
          options:
            model: gemini-2.5-flash       # Gemini 2.5 Flash 모델
            temperature: 0.0              # 결정적 응답
            max-output-tokens: 1024        # 최대 출력 토큰 수
            top-p: 0.9                    # Nucleus sampling
            top-k: 40                     # 상위 K 후보 고려
logging:
  level:
    com.nhnacademy.springaiflyschedule: DEBUG
    org.springframework.ai: DEBUG

data-go-kr:
  api:
    url: https://apis.data.go.kr/1613000/DmstcFlightNvgInfo
    service-key: ${DATA_GO_KR_SERVICE_KEY} # 환경 변수