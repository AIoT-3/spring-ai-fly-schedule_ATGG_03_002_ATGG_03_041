<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>항공편 검색</title>

    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>

</head>
<body>
<div class="page">
    <div class="page">
        <header class="navbar navbar-expand-sm navbar-light d-print-none">
            <div class="container-xl">
                <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3"/>
                <div class="navbar-nav flex-row order-md-last">
                    <div class="nav-item">
                        <a href="#" class="nav-link d-flex lh-1 text-reset p-0"/>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-wrapper">
            <div class="page-body">
                <div class="container-xl">
                    <div class="row row-deck row-cards">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body" style="height: 10rem">항공편 검색</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="card">
                                <div class="card-body" style="height: 20rem">
                                    공항 정보
                                    <hr/>
                                    <div class="mb-3">
                                        <button class="btn btn-primary me-2" type="button" onclick="getAirports()">
                                            <i class="ti ti-list me-1"></i>전체 공항 목록
                                        </button>
                                        <button class="btn btn-primary me-2" type="button" onclick="getAirportCode()">
                                            <i class="ti ti-list me-1"></i>공항 코드 조회
                                        </button>
                                    </div>
                                    <div class="mb-3">
                                        <input type="text" class="form-control" id="airportName"
                                               placeholder="공항 이름"/>
                                    </div>
                                    <div id="airportResult" class="response-card" style="display:none;"></div>
                                </div>
                            </div>

                        </div>
                        <div class="col-6">
                            <div class="card">
                                <div class="card-body" style="height: 20rem">항공사 정보</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js"></script>

<script>
    const API_BASE = '/api/mcp';

    async function getAirports() {
        await callAPI('airport',`${API_BASE}/airports`, formatAirlineList)
    }

    async function callAPI(type, url, formatFunc) {
        const resultDiv = document.getElementById(`${type}Result`);
        showLoading();
        resultDiv.style.display = 'none';

        try {
            const response = await fetch(url);
            const data = await response.json();

            resultDiv.innerHTML = formatFunc ? formatFunc(data) : `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            resultDiv.style.display = 'block';
        } catch (error) {
            resultDiv.innerHTML = `<div class="alert alert-danger">
                    <i class="ti ti-alert-circle me-2"></i>
                    에러: ${error.message}
                </div>`;
            resultDiv.style.display = 'block';
        } finally {
            hideLoading();
        }
    }

    function showLoading() {
        // 로딩바를 보여주거나 콘솔에 출력
        console.log("데이터를 불러오는 중...");
    }

    function hideLoading() {
        console.log("완료.");
    }

</script>
</body>
</html>
