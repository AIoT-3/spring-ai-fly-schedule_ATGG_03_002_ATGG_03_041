<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>항공편 검색 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #f4f6fa;
        }

        .response-card {
            margin-top: 1rem;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e6e8e9;
            border-radius: 4px;
            padding: 1rem;
            background: #fafbfc;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="page-wrapper">
        <div class="container-xl py-4">
            <div class="row row-cards">
                <div class="col-12">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <a href="/" class="text-white text-decoration-none">
                                <h2>✈️ 항공편 검색 시스템</h2>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="page-header d-print-none">
                    <div class="col-auto ms-auto d-print-none">
                            <span class="d-none d-sm-inline">
                                <a href="/" class="btn btn-white">
                                    <i class="ti ti-home me-1"></i>
                                    메인으로
                                </a>
                            </span>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card">
                        <div class="card-header"><h3 class="card-title">항공기 조회</h3></div>
                        <div class="card-body">

                            <form id="flightSearchForm">
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">출발 공항</label>
                                        <select class="form-select" id="departure" name="departure"></select>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">도착 공항</label>

                                        <select class="form-select" id="arrival" name="arrival"></select>

                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">날짜</label>
                                        <input type="text" class="form-control" id="date" name="date"
                                               placeholder="내일, 모레, 2026-03-10">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">기준 시간 (선택)</label>
                                        <input type="text" class="form-control" id="afterTime" name="afterTime"
                                               placeholder="14:00">
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label class="form-label">최소 가격 (선택)</label>
                                        <input type="number" class="form-control" id="minPrice" name="minPrice"
                                               placeholder="30000">
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label class="form-label">최대 가격 (선택)</label>
                                        <input type="number" class="form-control" id="maxPrice" name="maxPrice"
                                               placeholder="70000">
                                    </div>
                                </div>
                                <div class="d-flex">
                                    <button type="button" class="btn btn-outline-primary" onclick="searchFlights()">
                                        <i class="ti ti-api me-1"></i>검색
                                    </button>
                                </div>
                            </form>
                            <div id="flightResult" class="response-card" style="display:none;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header"><h3 class="card-title">공항 정보 조회</h3></div>
                        <div class="card-body">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="airportName"
                                       placeholder="공항 이름을 입력하세요 (예: 인천)">
                            </div>
                            <div class="d-flex gap-2 mb-3">
                                <button class="btn btn-outline-primary w-50" onclick="getAirportList()">전체 목록</button>
                                <button class="btn btn-primary w-50" onclick="getAirportCode()">코드 조회</button>
                            </div>
                            <div id="airportResult" class="response-card" style="display:none;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header"><h3 class="card-title">항공사 정보</h3></div>
                        <div class="card-body">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="airlineName"
                                       placeholder="공항 이름을 입력하세요 (예: 아시아나항공)">
                            </div>
                            <div class="d-flex gap-2 mb-3">
                                <button class="btn btn-outline-primary w-50" onclick="getAirlineList()">전체 목록</button>
                                <button class="btn btn-primary w-50" onclick="getAirlineId()">코드 조회</button>
                            </div>
                            <div id="airlineResult" class="response-card" style="display:none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 fw-bold">데이터를 불러오는 중입니다...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js"></script>
<script>
    const API_BASE = '/api/mcp';

    async function callAPI(type, url, formatFunc) {
        const resultDiv = document.getElementById(`${type}Result`);
        showLoading();
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`에러 발생: ${response.status}`);
            const data = await response.json();
            resultDiv.innerHTML = formatFunc ? formatFunc(data) : `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            resultDiv.style.display = 'block';
        } catch (error) {
            resultDiv.innerHTML = `<div class="alert alert-danger mb-0">${error.message}</div>`;
            resultDiv.style.display = 'block';
        } finally {
            hideLoading();
        }
    }


    async function searchFlights() {
        const departure = document.getElementById('departure').value;
        const arrival = document.getElementById('arrival').value;
        const date = document.getElementById('date').value || '내일';
        const afterTime = document.getElementById('afterTime').value;
        const minPrice = document.getElementById('minPrice').value;
        const maxPrice = document.getElementById('maxPrice').value;

        let url = `${API_BASE}/flight/search`;

        const params = new URLSearchParams();

        params.append("departure", departure);
        params.append("arrival", arrival);
        params.append("date", date);

        if (afterTime) {
            url = `${API_BASE}/flight/search/time`;
            params.append("afterTime", afterTime);
        }

        if (minPrice || maxPrice) {
            url = `${API_BASE}/flight/search/price`;
            if (minPrice) params.append("minPrice", minPrice);
            if (maxPrice) params.append("maxPrice", maxPrice);
        }

        url += `?${params.toString()}`;

        await callAPI('flight', url, formatFlightResults);
    }

    function formatFlightResults(data) {
        const flights = data;
        const airlines = Object.keys(flights);

        if (airlines.length === 0) {
            return `<div class="alert alert-warning">검색 결과 없음</div>`;
        }

        let html = '';

        airlines.forEach(airline => {
            const list = flights[airline];

            html += `
            <h4 class="mt-3">
                <span class="badge bg-primary">${airline}</span>
                <span class="badge bg-secondary">${list.length}편</span>
            </h4>
        `;

            list.forEach(flight => {
                const dep = flight.depPlandTime.slice(8,10) + ":" + flight.depPlandTime.slice(10,12);
                const arr = flight.arrPlandTime.slice(8,10) + ":" + flight.arrPlandTime.slice(10,12);

                const price = flight.economyCharge > 0
                    ? flight.economyCharge.toLocaleString() + "원"
                    : "가격 없음";

                html += `
                <div class="border rounded p-2 mb-2">
                    <div><b>${dep} → ${arr}</b></div>
                    <div>${flight.vihicleId}</div>
                    <div>${price}</div>
                </div>
            `;
            });
        });

        return html;
    }

    function formatAirports(airports) {
        return `
            <div class="alert alert-success py-2 mb-2">총 ${airports.length}개 조회됨</div>
            <ul class="list-unstyled mb-0">
                ${airports.map(a => `<li class="p-2 border-bottom border-light">${a.airportId} - <strong>${a.airportNm}</strong></li>`).join('')}
            </ul>
        `;
    }

    function formatAirportCode(airport) {
        return `
        <div class="alert alert-success mb-0">
            <strong>${airport.airportNm}</strong>
            (${airport.airportId})
        </div>
    `;

    }

    function formatAirlines(airlines) {
        return `
            <div class="alert alert-success py-2 mb-2">총 ${airlines.length}개 조회됨</div>
            <ul class="list-unstyled mb-0">
                ${airlines.map(a => `<li class="p-2 border-bottom border-light">${a.airlineId} - <strong>${a.airlineNm}</strong></li>`).join('')}
            </ul>
        `;
    }

    function formatAirlineId(airline) {
        return `
        <div class="alert alert-success mb-0">
            <strong>${airline.airlineNm}</strong>
            (${airline.airlineId})
        </div>
    `;
    }

    function getAirportList() {
        callAPI('airport', `${API_BASE}/airports`, formatAirports);
    }

    function getAirportCode() {
        const name = document.getElementById('airportName').value;
        if (!name.trim()) return alert('공항 이름을 입력하세요.');
        callAPI('airport', `${API_BASE}/airports/code?airportName=${encodeURIComponent(name)}`, formatAirportCode);
    }

    function getAirlineList() {
        callAPI('airline', `${API_BASE}/airlines`, formatAirlines);
    }

    function getAirlineId() {
        const name = document.getElementById('airlineName').value;
        if (!name.trim()) return alert('항공사 명을 입력하세요.');
        callAPI('airline', `${API_BASE}/airlines/id?airlineName=${encodeURIComponent(name)}`, formatAirlineId);

    }

    function showLoading() {
        document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    function fillBasicSearch() {
        document.getElementById('date').value = '내일';
        document.getElementById('afterTime').value = '';
        document.getElementById('minPrice').value = '';
        document.getElementById('maxPrice').value = '';

    }

    async function loadAirports() {
        try {
            const response = await fetch(`${API_BASE}/airports`);

            if (!response.ok) {
                throw new Error("공항 목록 조회 실패");
            }

            const airports = await response.json();

            const departureSelect = document.getElementById("departure");
            const arrivalSelect = document.getElementById("arrival");

            departureSelect.innerHTML = "";
            arrivalSelect.innerHTML = "";

            airports.forEach(airport => {

                const departureOption = document.createElement("option");
                departureOption.value = airport.airportId;
                departureOption.textContent = airport.airportNm;

                const arrivalOption = document.createElement("option");
                arrivalOption.value = airport.airportId;
                arrivalOption.textContent = airport.airportNm;

                departureSelect.appendChild(departureOption);
                arrivalSelect.appendChild(arrivalOption);
            });

            departureSelect.value = "NAARKJJ";
            arrivalSelect.value = "NAARKPC";

        } catch (error) {
            console.error(error);
            alert("공항 목록을 불러오지 못했습니다.");
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadAirports();
        fillBasicSearch()
    });
</script>
</body>
</html>
